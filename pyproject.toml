[project]
name = "pyhcl"
version = "0.1.0"
description = "A Python implementation of HashiCorp HCL2 (reader + writer)"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Manik Mehta", email = "mehtamanik96@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
hcldec = "pyhcl.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.16.10",
    "typer>=0.27.0",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, pyupgrade, bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI parameters as calls in argument defaults
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
files = ["src"]
strict = true
